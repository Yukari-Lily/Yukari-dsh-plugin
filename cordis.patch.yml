# Yukari 插件合集：主行 + 6 个可在「插件」页单独开关的组件
- insert:
    - id: yukari
      name: yukari-dsh-plugin

    - id: yukari-chats
      name: yukari-dsh-plugin/chats
      config:
        sessionsRoot: ''
        titleBudget: 160

    - id: yukari-sites
      name: yukari-dsh-plugin/sites
      config:
        root: /workspace/publish
        # 站点链接的默认前缀；也可以在面板「站点」页直接填写自己的域名
        publicBase: http://127.0.0.1:3080/p
        maxMb: 200
        keep: 5

    - id: yukari-proxy
      name: yukari-dsh-plugin/proxy
      config:
        localPort: 17890
        bypass: localhost,127.0.0.1,::1
        autoStart: false

    - id: yukari-purge
      name: yukari-dsh-plugin/purge

    - id: yukari-browser
      name: yukari-dsh-plugin/browser
      config:
        viewportWidth: 1280
        viewportHeight: 900
        settleMs: 300

    - id: yukari-runtime
      name: yukari-dsh-plugin/runtime
      config:
        channel: ''
        registry: ''
        restartMode: auto
        restartCommand: ''
        restartDelayMs: 800
